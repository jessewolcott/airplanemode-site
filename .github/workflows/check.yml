name: check

on:
  push:
  pull_request:

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck (POSIX sh)
        run: shellcheck -s sh -e SC2046,SC2086 install.sh tests/openwrt-run.sh
      - uses: docker/setup-qemu-action@v3
      - name: Installer on OpenWrt 24.10 arm64 (busybox sh, stub Docker)
        run: |
          docker run --rm --platform linux/aarch64_generic -v "$PWD:/src:ro" \
            -v "$PWD/tests/docker-stub:/usr/bin/docker:ro" \
            openwrt/rootfs:aarch64_generic-24.10.4 sh /src/tests/openwrt-run.sh

  # GitHub Pages (platform decision 0019): only after the installer checks pass, only from main,
  # and only the files the site needs (not tests/, llm/ or the notes).
  pages:
    needs: installer
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Stage the site
        run: |
          mkdir _site
          cp -r index.html install.sh assets CNAME _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
